version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/webserver"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/webserver"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions" 
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
