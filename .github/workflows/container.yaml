name: Container image
on:
  workflow_call:
    inputs:
      context:
        description: Directory containing docker-bake.hcl and Dockerfile.
        type: string
        required: true
      image:
        description: Image name without tag (e.g. ghcr.io/owner/app).
        type: string
        required: true
      bake-target:
        type: string
        default: build 
      trivy-config:
        type: string
        default: trivy.yaml

permissions: {}

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            ${{ inputs.context }}
            ${{ inputs.trivy-config }}
      - name: Login to registry
        if: inputs.push
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Container image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build container image
        uses: docker/bake-action@v7.5.0
        with:
          load: true
          workdir: ${{ inputs.context }}
          source: "{{defaultContext}}:${{ inputs.context }}"
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-tags }}
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          targets: ${{ inputs.bake-target }}
      - name: Scan container image for vulnerabilities
        uses: ./.github/actions/trivy-sarif
        with:
          category: trivy-image
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          trivy-config: ${{ inputs.trivy-config }}
      - name: Push container image
        uses: docker/bake-action@v7.5.0
        with:
          push: true
          workdir: ${{ inputs.context }}
          source: "{{defaultContext}}:${{ inputs.context }}"
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-tags }}
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          targets: ${{ inputs.bake-target }}
