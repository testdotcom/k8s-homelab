name: CICD pipeline
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/go-ci.yaml
    with:
      working-directory: webserver

  security-scan:
    permissions:
      contents: write
      security-events: write
    uses: ./.github/workflows/security-scan.yaml
    with:
      app-path: webserver
      iac-paths: |
        iac
        argocd-apps

  container:
    needs: [go-ci, security-scan]
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/container.yaml
    with:
      context: webserver
      image: ghcr.io/testdotcom/webserver
